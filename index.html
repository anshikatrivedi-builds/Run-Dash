
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jungle Dash - Temple Run</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #10251b;
    color: white;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

#hud {
    position: fixed;
    top: 20px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    font-weight: bold;
    pointer-events: none;
    text-shadow: 2px 2px 5px black;
}

#menu {
    position: fixed;
    inset: 0;
    background: #07140dcc;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.panel {
    background: #153b2b;
    padding: 35px 25px;
    border: 2px solid #d8b64c;
    border-radius: 20px;
    max-width: 400px;
}

h1 {
    color: #ffd84d;
    font-size: 38px;
    margin-bottom: 15px;
}

p {
    line-height: 1.6;
    margin-bottom: 20px;
}

button {
    background: #ffd84d;
    border: none;
    padding: 14px 25px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
}

#controls {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 12px;
}

#controls button {
    width: 55px;
    height: 50px;
    padding: 5px;
    background: #142a20dd;
    color: white;
    border: 1px solid #ffd84d;
    font-size: 23px;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div>🏃 JUNGLE DASH</div>
    <div>🪙 <span id="coins">0</span>
    &nbsp; | &nbsp; Score: <span id="score">0</span></div>
</div>

<div id="menu">
    <div class="panel">
        <h1 id="heading">TEMPLE RUN</h1>
        <p id="message">
            Run through the ancient jungle!<br>
            Collect coins and avoid obstacles.<br><br>
            ← → Change lane<br>
            ↑ Jump | ↓ Slide
        </p>
        <button id="start">START RUN ▶</button>
    </div>
</div>

<div id="controls">
    <button onclick="move(-1)">◀</button>
    <button onclick="jump()">⬆</button>
    <button onclick="slide()">⬇</button>
    <button onclick="move(1)">▶</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
}

window.addEventListener("resize", resize);
resize();

let running = false;
let lane = 0;
let playerLane = 0;
let jumpHeight = 0;
let jumpSpeed = 0;
let slideTime = 0;
let score = 0;
let coins = 0;
let speed = 0.35;
let spawnTimer = 0;
let coinTimer = 0;
let objects = [];
let lastTime = 0;

const lanes = [-1, 0, 1];

function startGame() {
    score = 0;
    coins = 0;
    speed = 0.35;
    lane = 0;
    playerLane = 0;
    jumpHeight = 0;
    jumpSpeed = 0;
    slideTime = 0;
    spawnTimer = 0;
    coinTimer = 0;
    objects = [];
    running = true;

    document.getElementById("coins").textContent = 0;
    document.getElementById("score").textContent = 0;
    document.getElementById("menu").classList.add("hidden");

    lastTime = performance.now();
}

document.getElementById("start").onclick = startGame;

function move(direction) {
    if (!running) return;
    lane = Math.max(-1, Math.min(1, lane + direction));
}

function jump() {
    if (!running || jumpHeight > 0 || slideTime > 0) return;
    jumpSpeed = 650;
}

function slide() {
    if (!running || jumpHeight > 0) return;
    slideTime = 0.65;
}

document.addEventListener("keydown", function(e) {
    if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) {
        e.preventDefault();
    }

    if (e.key === "ArrowLeft" || e.key === "a") move(-1);
    if (e.key === "ArrowRight" || e.key === "d") move(1);
    if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") jump();
    if (e.key === "ArrowDown" || e.key === "s") slide();
});

function spawnObject() {
    let type = Math.random() < 0.35 ? "coin" :
               Math.random() < 0.5 ? "block" : "arch";

    let l = lanes[Math.floor(Math.random() * 3)];

    objects.push({
        type: type,
        lane: l,
        z: 0,
        collected: false
    });
}

function roadPosition(lane, z) {
    const horizon = H * 0.28;
    const y = horizon + z * H * 0.75;
    const roadWidth = W * (0.12 + z * 0.78);

    return {
        x: W / 2 + lane * roadWidth * 0.29,
        y: y,
        scale: 0.15 + z * 1.1
    };
}

function polygon(points, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);

    for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i][0], points[i][1]);
    }

    ctx.closePath();
    ctx.fill();
}

function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#63969a");
    sky.addColorStop(0.4, "#d6ae72");
    sky.addColorStop(1, "#142e20");

    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Sun
    ctx.fillStyle = "#ffe6a1";
    ctx.beginPath();
    ctx.arc(W / 2, H * 0.23, Math.min(W,H)*0.055, 0, Math.PI*2);
    ctx.fill();

    // Jungle trees
    for (let i = 0; i < 12; i++) {
        const x = i * W / 11;
        const height = H * (0.15 + (i % 4) * 0.035);

        polygon([
            [x - 55, H * 0.42],
            [x, H * 0.28 - height * 0.4],
            [x + 55, H * 0.42]
        ], i % 2 ? "#234b32" : "#31563b");
    }

    // Distant temple
    ctx.fillStyle = "#3e5140";
    ctx.fillRect(W*0.43, H*0.18, W*0.14, H*0.13);

    polygon([
        [W*0.40, H*0.19],
        [W*0.50, H*0.10],
        [W*0.60, H*0.19]
    ], "#354b38");

    ctx.fillStyle = "#172b20";
    ctx.fillRect(W*0.475, H*0.22, W*0.05, H*0.09);

    // Stone road
    polygon([
        [W*0.45, H*0.28],
        [W*0.55, H*0.28],
        [W*0.98, H],
        [W*0.02, H]
    ], "#716547");

    polygon([
        [W*0.47, H*0.28],
        [W*0.53, H*0.28],
        [W*0.82, H],
        [W*0.18, H]
    ], "#93815a");

    // Road stones
    for (let i = 0; i < 14; i++) {
        let z = ((i / 14) + score * 0.0007) % 1;
        let y = H*0.28 + z * H*0.75;
        let width = W * (0.05 + z * 0.43);

        ctx.strokeStyle = "#554d38";
        ctx.lineWidth = 1 + z*2;

        ctx.beginPath();
        ctx.moveTo(W/2-width, y);
        ctx.lineTo(W/2+width, y);
        ctx.stroke();
    }

    // Lane lines
    ctx.strokeStyle = "#d6c18b99";

    for (let l of [-0.16, 0.16]) {
        ctx.beginPath();
        ctx.moveTo(W/2 + W*l*0.5, H*0.28);
        ctx.lineTo(W/2 + W*l*1.5, H);
        ctx.stroke();
    }
}

function drawPlayer() {
    const x = W/2 + playerLane * W*0.20;
    const y = H*0.80 - jumpHeight;
    const scale = Math.min(W/600, 1.25);

    // Shadow
    ctx.fillStyle = "#07120b99";
    ctx.beginPath();
    ctx.ellipse(x, H*0.83, 22*scale, 7*scale, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Legs
    ctx.strokeStyle = "#392b20";
    ctx.lineWidth = 9;
    ctx.lineCap = "round";

    if (slideTime > 0) {
        ctx.beginPath();
        ctx.moveTo(-5, 0);
        ctx.lineTo(20, 10);
        ctx.lineTo(34, 10);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-5, 0);
        ctx.lineTo(-25, 10);
        ctx.lineTo(-38, 10);
        ctx.stroke();
    } else {
        ctx.beginPath();
        ctx.moveTo(-7, -8);
        ctx.lineTo(-15, 15);
        ctx.lineTo(-20, 35);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(7, -8);
        ctx.lineTo(15, 15);
        ctx.lineTo(20, 34);
        ctx.stroke();
    }

    // Body
    ctx.fillStyle = "#c29a60";
    polygon([
        [-13,-35], [13,-35],
        [17,-7], [-13,-7]
    ], "#c29a60");

    // Belt
    ctx.fillStyle = "#483923";
    ctx.fillRect(-13, -13, 26, 5);

    // Arms
    ctx.strokeStyle = "#c18d5c";
    ctx.lineWidth = 7;

    ctx.beginPath();
    ctx.moveTo(-12,-29);
    ctx.lineTo(-23,-12);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(12,-29);
    ctx.lineTo(23,-15);
    ctx.stroke();

    // Head
    ctx.fillStyle = "#b98255";
    ctx.beginPath();
    ctx.arc(0,-45,10,0,Math.PI*2);
    ctx.fill();

    // Hair
    ctx.fillStyle = "#4a3021";
    ctx.beginPath();
    ctx.arc(0,-49,10,Math.PI,Math.PI*2);
    ctx.fill();

    ctx.restore();
}

function drawObject(obj) {
    const p = roadPosition(obj.lane, obj.z);
    const x = p.x;
    const y = p.y;
    const s = p.scale;

    ctx.save();
    ctx.translate(x, y);

    if (obj.type === "coin") {
        const r = 5 + s*8;

        ctx.fillStyle = "#ffcc24";
        ctx.strokeStyle = "#fff19b";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.ellipse(0, -r, r*0.7, r, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#fff2a0";
        ctx.fillRect(-2, -r*1.5, 3, r);
    }

    if (obj.type === "block") {
        const w = 18 + s*30;
        const h = 20 + s*30;

        polygon([
            [-w/2,-h], [w/2,-h],
            [w/2,0], [-w/2,0]
        ], "#69513a");

        ctx.strokeStyle = "#c4a16c";
        ctx.strokeRect(-w/2,-h,w,h);
    }

    if (obj.type === "arch") {
        const w = 20 + s*35;
        const h = 30 + s*35;

        ctx.fillStyle = "#665039";
        ctx.fillRect(-w/2,-h,w*0.23,h);
        ctx.fillRect(w*0.27,-h,w*0.23,h);
        ctx.fillRect(-w/2,-h,w,h*0.22);

        ctx.fillStyle = "#152c20";
        ctx.fillRect(-w*0.25,-h*0.78,w*0.5,h*0.55);
    }

    ctx.restore();
}

function gameOver() {
    running = false;

    document.getElementById("heading").textContent = "GAME OVER!";
    document.getElementById("message").innerHTML =
        "Distance: " + Math.floor(score) +
        " metres<br>Coins collected: " + coins +
        "<br><br>Can you beat your score?";

    document.getElementById("start").textContent = "PLAY AGAIN ↻";
    document.getElementById("menu").classList.remove("hidden");
}

function update(dt) {
    score += dt * speed * 35;
    speed = Math.min(0.68, speed + dt*0.003);

    playerLane += (lane-playerLane) * Math.min(1,dt*12);

    if (jumpSpeed !== 0 || jumpHeight > 0) {
        jumpHeight += jumpSpeed * dt;
        jumpSpeed -= 1700 * dt;

        if (jumpHeight <= 0) {
            jumpHeight = 0;
            jumpSpeed = 0;
        }
    }

    slideTime = Math.max(0, slideTime-dt);

    spawnTimer -= dt;
    coinTimer -= dt;

    if (spawnTimer <= 0) {
        spawnObject();
        spawnTimer = 0.8 + Math.random()*0.6;
    }

    if (coinTimer <= 0) {
        objects.push({
            type: "coin",
            lane: lanes[Math.floor(Math.random()*3)],
            z: 0,
            collected: false
        });
        coinTimer = 0.4;
    }

    for (let obj of objects) {
        obj.z += speed*dt;

        if (obj.type === "coin" &&
            obj.z > 0.80 && obj.z < 0.95 &&
            Math.abs(obj.lane-playerLane) < 0.45 &&
            !obj.collected) {

            obj.collected = true;
            coins++;
        }

        if (obj.type !== "coin" &&
            obj.z > 0.83 && obj.z < 0.94 &&
            Math.abs(obj.lane-playerLane) < 0.45 &&
            !obj.hit) {

            let safe = obj.type === "block"
                ? jumpHeight > 45
                : slideTime > 0;

            if (!safe) {
                gameOver();
                return;
            }

            obj.hit = true;
        }
    }

    objects = objects.filter(o => o.z < 1.12 && !o.collected);

    document.getElementById("score").textContent = Math.floor(score);
    document.getElementById("coins").textContent = coins;
}

function draw() {
    drawBackground();

    objects
        .slice()
        .sort((a,b) => a.z-b.z)
        .forEach(drawObject);

    drawPlayer();
}

function loop(time) {
    const dt = Math.min((time-lastTime)/1000 || 0, 0.035);
    lastTime = time;

    if (running) update(dt);

    draw();
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
